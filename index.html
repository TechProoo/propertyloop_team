<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Installable: staff put the portal on their home screen and it opens
      full-screen, like an app, with its own "PL Team" icon so it is not
      confused with the customer app on the same phone. Android reads the
      manifest; iOS reads the apple-* tags.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PL Team" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      This is a private staff portal, so the metadata below is doing the
      opposite of the website's job: keep it out of search entirely, and make
      the link render properly when somebody pastes it into the team chat.

      noindex is repeated as an X-Robots-Tag header in public/_headers, which
      is what covers responses nobody executes the HTML of.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>PropertyLoop Team</title>
    <meta
      name="description"
      content="Private staff portal for PropertyLoop Ltd — deals, inventory, leads, daily logs and internal messaging. Staff sign-in required."
    />
    <meta name="application-name" content="PropertyLoop Team" />
    <meta name="theme-color" content="#1f6f43" />
    <meta name="color-scheme" content="light" />
    <!-- Nigerian numbers on a page full of prices: stop iOS turning figures
         into phone links. -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Link preview. A bare URL in the group chat looks like a phishing
         attempt; a card with the logo on it does not. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PropertyLoop" />
    <meta property="og:title" content="PropertyLoop Team" />
    <meta
      property="og:description"
      content="Private staff portal for PropertyLoop Ltd. Staff sign-in required."
    />
    <meta property="og:url" content="https://team.propertyloop.ng/" />
    <meta property="og:image" content="https://team.propertyloop.ng/logo.png" />
    <meta property="og:image:width" content="1695" />
    <meta property="og:image:height" content="693" />
    <meta property="og:image:alt" content="PropertyLoop" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PropertyLoop Team" />
    <meta
      name="twitter:description"
      content="Private staff portal for PropertyLoop Ltd. Staff sign-in required."
    />
    <meta name="twitter:image" content="https://team.propertyloop.ng/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
