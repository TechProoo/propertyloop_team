<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Installable: staff put the portal on their home screen and it opens
      full-screen, like an app, with its own "PL Team" icon so it is not
      confused with the customer app on the same phone. Android reads the
      manifest; iOS reads the apple-* tags.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PL Team" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      This is a private staff portal, so the metadata below is doing the
      opposite of the website's job: keep it out of search entirely, and make
      the link render properly when somebody pastes it into the team chat.

      noindex is repeated as an X-Robots-Tag header in public/_headers, which
      is what covers responses nobody executes the HTML of.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>PropertyLoop Team</title>
    <meta
      name="description"
      content="Private staff portal for PropertyLoop Ltd — deals, inventory, leads, daily logs and internal messaging. Staff sign-in required."
    />
    <meta name="application-name" content="PropertyLoop Team" />
    <meta name="theme-color" content="#1f6f43" />
    <meta name="color-scheme" content="light" />
    <!-- Nigerian numbers on a page full of prices: stop iOS turning figures
         into phone links. -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Link preview. A bare URL in the group chat looks like a phishing
         attempt; a card with the logo on it does not. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PropertyLoop" />
    <meta property="og:title" content="PropertyLoop Team" />
    <meta
      property="og:description"
      content="Private staff portal for PropertyLoop Ltd. Staff sign-in required."
    />
    <meta property="og:url" content="https://team.propertyloop.ng/" />
    <meta property="og:image" content="https://team.propertyloop.ng/logo.png" />
    <meta property="og:image:width" content="1695" />
    <meta property="og:image:height" content="693" />
    <meta property="og:image:alt" content="PropertyLoop" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PropertyLoop Team" />
    <meta
      name="twitter:description"
      content="Private staff portal for PropertyLoop Ltd. Staff sign-in required."
    />
    <meta name="twitter:image" content="https://team.propertyloop.ng/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Splash. Lives in the HTML so it paints the moment the page arrives —
      before the ~750 KB script has downloaded, which on phone data can be
      several seconds of blank white otherwise. React replaces the contents of
      #root on its first render, so nothing needs to remove it.
    -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        background: #f4f7f4;
        color: #16201c;
        font-family: 'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .boot img {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        box-shadow: 0 10px 30px -12px rgba(15, 68, 41, 0.45);
      }
      .boot-name {
        margin: 0;
        font: 600 19px/1.2 'Playfair Display', Georgia, serif;
      }
      .boot-track {
        width: 150px;
        height: 4px;
        overflow: hidden;
        border-radius: 99px;
        background: #dee5df;
      }
      .boot-track span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: #1f6f43;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      .boot-slow {
        max-width: 260px;
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        color: #7d8a84;
        opacity: 0;
        animation: boot-show 0.4s ease 8s forwards;
      }
      @keyframes boot-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(260%); }
      }
      @keyframes boot-show {
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-track span { animation: none; width: 100%; opacity: 0.5; }
        .boot-slow { animation-duration: 0.01ms; }
      }
    </style>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <img src="/icons/icon-192.png" alt="" />
        <p class="boot-name">PropertyLoop Team</p>
        <div class="boot-track"><span></span></div>
        <p class="boot-slow">Still loading — your connection seems slow. Keep this page open.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
